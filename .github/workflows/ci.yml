name: CI

# The fast lane only (owner ruling 2026-11-22): build, static checks, unit tests and the
# fixed-seed smoke of the simulation and end-to-end tests, a few minutes per push. The full
# gate suite, fuzz budgets, seed sweeps and gate canaries are on-demand runs; the commands
# are listed in agent_work/gates/ci-fast.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast lane through Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, static checks, unit tests and fixed-seed smoke in the dev container
        run: agent_work/gates/ci-fast.sh
      - name: Prose provenance of everything this push landed
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: agent_work/gates/ci-prose.sh "$BEFORE" HEAD
      - name: Upload fast-lane result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-lane-result
          path: |
            agent_work/ci/gates/result.json
            agent_work/ci/gates/*.log
          if-no-files-found: ignore

  observability:
    name: Objnode through Collector to Prometheus
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify real objnode metrics through the Docker pipeline
        env:
          COMPOSE_PROJECT_NAME: objstore-obs-ci
        run: agent_work/10-observability/check-otel.sh
      - name: Upload observability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-proof
          path: agent_work/10-observability/evidence/node/
          if-no-files-found: error
