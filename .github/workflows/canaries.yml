name: Gate canaries

# Testing the tester: agent_work/gates/canaries.sh plants one violation at a time in a copy
# of the tree and requires the gate to go red on the check that owns it. Several canaries
# are full gate runs, so the whole set costs many times one gate run and grows with the
# tree (over five hours once the integrated node had landed). It is a long run, so it is
# on demand only (owner ruling 2026-11-22: nothing long runs on a push or on a schedule):
# start it here by hand, or run agent_work/gates/canaries.sh locally. Tick "fast" for the
# G0/G6 subset (a few minutes).
on:
  workflow_dispatch:
    inputs:
      fast:
        description: Only the fast G0/G6 canaries
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canaries:
    name: Gate canaries through Docker
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate canaries
        env:
          CANARY_FAST: ${{ inputs.fast && '1' || '' }}
        run: agent_work/gates/canaries.sh
      - name: Upload canary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-result
          path: agent_work/0a-foundation/gates/canaries.json
          if-no-files-found: ignore
