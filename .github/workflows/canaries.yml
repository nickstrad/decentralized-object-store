name: Gate canaries

# Testing the tester: agent_work/gates/canaries.sh plants one violation at a time in a copy
# of the tree and requires the gate to go red on the check that owns it. Several canaries
# are full gate runs, so the whole set costs many times one gate run and grows with the
# tree (over two hours once five protocol packages had landed, which no longer fitted the
# CI job or the gap between pushes). It therefore runs when the tester itself changes, on
# demand, and once a week — not on every push (ci.yml keeps the fast G0/G6 subset on every
# push). Runs queue; a later push never cancels one.
on:
  push:
    branches: [main]
    paths:
      - 'agent_work/gates/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'agent_work/gates/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.yaml'
      - 'go.mod'
      - 'go.sum'
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canaries:
    name: Gate canaries through Docker
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate canaries
        run: agent_work/gates/canaries.sh
      - name: Upload canary result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-result
          path: agent_work/0a-foundation/gates/canaries.json
          if-no-files-found: ignore
