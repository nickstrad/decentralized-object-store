name: objstore

x-node: &node
  image: objstore-dev:local
  profiles: ["cluster"]
  working_dir: /src
  volumes:
    - .:/src
    - gomod:/go/pkg/mod
    - gocache:/root/.cache/go-build
  networks: [cluster]
  restart: "no"

services:
  dev:
    build: .
    image: objstore-dev:local
    working_dir: /src
    init: true
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    environment:
      - DST_SEED
      - DST_SEEDS
      - DST_SEED_BASE
      - DST_ARTIFACTS
      - GATE_SHA
      - GATE_ONLY
      - FUZZ_SECONDS

  node-a1:
    <<: *node
    hostname: node-a1
    command: ["go", "run", "./cmd/objnode", "-id", "node-a1:7946", "-region", "a", "-listen", ":7946", "-data", "/data", "-http", ":8080", "-k", "2", "-m", "1", "-seeds", "node-a1:7946,node-b1:7946,node-c1:7946"]
    ports: ["127.0.0.1::8080"]
  node-b1:
    <<: *node
    hostname: node-b1
    command: ["go", "run", "./cmd/objnode", "-id", "node-b1:7946", "-region", "b", "-listen", ":7946", "-data", "/data", "-http", ":8080", "-k", "2", "-m", "1", "-seeds", "node-a1:7946,node-b1:7946,node-c1:7946"]
    ports: ["127.0.0.1::8080"]
  node-c1:
    <<: *node
    hostname: node-c1
    command: ["go", "run", "./cmd/objnode", "-id", "node-c1:7946", "-region", "c", "-listen", ":7946", "-data", "/data", "-http", ":8080", "-k", "2", "-m", "1", "-seeds", "node-a1:7946,node-b1:7946,node-c1:7946"]
    ports: ["127.0.0.1::8080"]

networks:
  cluster: {}

volumes:
  gomod:
    name: objstore-gomod
  gocache:
    name: objstore-gocache
