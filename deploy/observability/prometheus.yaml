global:
  scrape_interval: 1s
  scrape_timeout: 1s
scrape_configs:
  - job_name: objstore-otel
    honor_labels: true
    static_configs:
      - targets: [otel-collector:9464]
    # Collector target_info includes resource attributes; keep boot IDs out of storage.
    metric_relabel_configs:
      - action: labeldrop
        regex: boot_id
